name: Generate metrics

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          # GITHUB_TOKEN only exposes public activity. To include private
          # contributions, create a classic PAT with the `read:user` scope,
          # store it as the METRICS_TOKEN secret and swap the line below for:
          #   token: ${{ secrets.METRICS_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          template: classic
          # `repositories`, `plugin_languages` and `plugin_lines` need access to
          # the repositories themselves, which GITHUB_TOKEN does not grant here —
          # they render empty. Add them back once METRICS_TOKEN (a PAT with
          # `read:user` + `repo`) is configured above.
          base: header, activity, community
          config_timezone: America/Guayaquil
          # isocalendar is intentionally off: its 3D plate renders on a light
          # background that cannot be themed via extras_css, and the streak +
          # snake cards below it already cover contribution activity.
          config_display: large
          config_animations: no
          extras_css: |
            svg { background: #0d1117; color: #8b949e; }
            h1, h2, h3 { color: #58a6ff !important; }
            .field, .field span, text, tspan { color: #c9d1d9; fill: #c9d1d9; }
            .field svg { fill: #8b949e !important; }
            :root {
              --color-calendar-graph-day-bg: #161b22 !important;
              --color-calendar-graph-day-border: rgba(255,255,255,.06) !important;
            }
            .calendar .day { outline-color: rgba(255,255,255,.06) !important; }
