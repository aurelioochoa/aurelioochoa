name: readmefetch

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [readmefetch.toml]

permissions:
  contents: write

concurrency:
  group: readmefetch
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aurelioochoa/readmefetch@v1
